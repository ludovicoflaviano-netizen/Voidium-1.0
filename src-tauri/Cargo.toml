[package]
name = "voidium"
version = "1.0.0"
edition = "2021"
description = "Voidium 1.0 privacy-focused non-Chromium browser"
license = "MPL-2.0"

[build-dependencies]
tauri-build = "2"
tauri-runtime-verso-build = { git = "https://github.com/versotile-org/tauri-runtime-verso.git" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6.0", default-features = false, features = ["common-controls-v6"] }
tauri-runtime-verso = { git = "https://github.com/versotile-org/tauri-runtime-verso.git" }
url = "2"
urlencoding = "2"
