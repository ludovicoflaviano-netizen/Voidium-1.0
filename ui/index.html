<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Voidium</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header class="topbar"><div class="brand">VOIDIUM</div><div class="tag">PRIVACY MATTERS.</div><div class="nav"><button id="back" title="Back">‹</button><button id="forward" title="Forward">›</button><button id="reload" title="Reload">↻</button></div><div class="address-wrap"><span class="lock">⌁</span><input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter an HTTPS address"><button id="go">Go</button></div><button id="optimizer" class="icon" title="Optimizer">⚡</button><button id="settings" class="icon" title="Settings">⚙</button></header>
<div class="tabs"><button class="tab active">New Tab <span>×</span></button><button id="newTab" class="newtab">+</button></div>
<main><section class="home"><div class="logo">VOIDIUM</div><div class="sub">Fast. Private. Lightweight.</div><div class="search"><input id="homeSearch" placeholder="Search or enter an HTTPS address"><button id="homeGo">Search</button></div><div class="quick"><button data-url="https://example.com">Example</button><button data-url="https://www.wikipedia.org">Wikipedia</button><button data-url="https://github.com">GitHub</button></div></section></main>
<aside id="drawer" class="drawer hidden"><div class="drawer-head"><h2 id="drawerTitle">Settings</h2><button id="closeDrawer">×</button></div><input id="settingSearch" class="filter" placeholder="Search settings..."><div id="drawerBody"></div></aside>
<footer><span>Voidium 1.1</span><span id="status">Ready</span><span id="scale">100%</span></footer></div><script src="settings.js"></script><script src="app.js"></script></body></html>
