name: Voidium Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: voidium-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            voidium-${{ runner.os }}-
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build
      - name: Locate installer
        shell: pwsh
        run: |
          Write-Host "Searching for Voidium installer..."
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Select-Object FullName,Length
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Voidium-Windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          compression-level: 6
          overwrite: true