[package]
name = "voidium"
version = "1.0.0"
edition = "2021"
description = "Voidium 1.0: lightweight non-Chromium browser foundation"
license = "MIT"

[dependencies]
anyhow = "1"
dirs-next = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
url = "2"
urlencoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
